
title: Lateral Movement Lifecycle - Credential Theft to RDP Escalation
description: Correlates LSASS access on one host with a subsequent RDP login and UAC bypass
    by the same user account across the environment.
status: test
author: Zeeshan Haider
tags:
    - attack.lateral_movement
    - attack.credential_access
correlation:
    type: temporal
    rules:
        - rule_id: detect_lsass_access_t1003.001 # LSASS Access
        - rule_id: Detect_Successful_RDP_Logon_t1021.001 # RDP Logon
        - rule_id: UAC_Bypass_via_Fodhelper_t1548.002 # UAC Bypass
    group-by:
        - User # The common denominator
    timespan: 30m
    ordered: true
level: critical
