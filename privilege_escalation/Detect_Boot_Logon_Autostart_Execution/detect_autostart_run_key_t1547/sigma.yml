title: Autostart Run Key Modified With Suspicious Value [T1547]
name: autostart_run_key_t1547
status: test
description: >
    A Run / RunOnce autostart registry value is set to a user-writable path,
    script host, LOLBin, or encoded payload. Run keys execute their value at
    logon; HKLM Run keys execute for every user and are a common persistence and
    privilege-escalation pivot.
references:
    - https://attack.mitre.org/techniques/T1547/001/
author: Detection Engineering
date: 2026-07-19
logsource:
    category: registry_set
    product: windows
detection:
    selection_keys:
        TargetObject|contains:
            - '\Software\Microsoft\Windows\CurrentVersion\Run\'
            - '\Software\Microsoft\Windows\CurrentVersion\RunOnce\'
            - '\Software\Microsoft\Windows\CurrentVersion\RunOnceEx\'
            - '\Software\Microsoft\Windows\CurrentVersion\RunServices\'
            - '\Software\Microsoft\Windows\CurrentVersion\Policies\Explorer\Run\'
            - '\Software\Wow6432Node\Microsoft\Windows\CurrentVersion\Run\'
    selection_susp_value:
        Details|contains:
            - '\Temp\'
            - '\AppData\'
            - '\Users\Public\'
            - '\ProgramData\'
            - '\Downloads\'
            - 'powershell'
            - 'pwsh'
            - 'cmd /c'
            - 'cmd.exe /c'
            - 'mshta'
            - 'rundll32'
            - 'regsvr32'
            - 'wscript'
            - 'cscript'
            - '-enc'
            - 'FromBase64String'
            - 'DownloadString'
    condition: selection_keys and selection_susp_value
falsepositives:
    - Legitimate software configuring autostart from AppData/ProgramData
level: medium
tags:
    - attack.privilege-escalation
    - attack.persistence
    - attack.t1547.001
