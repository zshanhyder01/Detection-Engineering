title: Potential Persistence Attempt Via Run Keys Using Reg.exe
id: detect_registry_add_modify_t1547.001
status: test
description: Detects suspicious command line reg.exe tool adding key to RUN key in Registry.
author: Zeeshan Haider
date: 10-06-26
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\reg.exe'
        CommandLine|contains|all:
            - 'reg'
            - ' add '
        CommandLine|contains:
            - 'Software\Microsoft\Windows\CurrentVersion\Run'
            - '\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Run'
            - '\Software\Microsoft\Windows\CurrentVersion\Policies\Explorer\Run'
    condition: selection
falsepositives:
    - Legitimate software installation (usually occurs during setup).
    - Legitimate administrative activity.
level: medium
tags:
    - attack.privilege-escalation
    - attack.persistence
    - attack.t1547.001
