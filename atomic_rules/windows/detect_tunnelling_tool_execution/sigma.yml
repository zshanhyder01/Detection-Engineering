title: Network Tunnelling Tool Executed
name: tunnelling_tool_execution
status: test
description: |
    Detects execution of tunnelling and port-forwarding utilities. These tools
    create an inbound path into a network by making an outbound connection
    that the firewall permits, and are used to reach hosts that have no
    Internet-facing service of their own.
references:
    - https://attack.mitre.org/techniques/T1133/
    - https://attack.mitre.org/techniques/T1572/
date: 2026-07-23
tags:
    - attack.initial-access
    - attack.t1133
    - attack.command-and-control
    - attack.t1572
logsource:
    category: process_creation
    product: windows
detection:
    selection_tool:
        Image|endswith:
            - '\ngrok.exe'
            - '\chisel.exe'
            - '\frpc.exe'
            - '\frps.exe'
            - '\gost.exe'
            - '\cloudflared.exe'
            - '\localtonet.exe'
            - '\playit.exe'
    selection_cmdline:
        CommandLine|contains:
            - 'ngrok tcp'
            - 'ngrok http'
            - 'ngrok authtoken'
            - 'tunnel --url'
            - 'cloudflared tunnel'
            - '-R 3389'
            - '-L 3389'
            - 'client --reverse'
    selection_ssh_reverse:
        Image|endswith:
            - '\ssh.exe'
            - '\plink.exe'
        CommandLine|contains: ' -R '
    condition: 1 of selection_*
fields:
    - Computer
    - User
    - Image
    - CommandLine
    - ParentImage
falsepositives:
    - Developers using ngrok or Cloudflare Tunnel to expose a local
      development server for testing
    - Legitimate use of Cloudflare Tunnel as sanctioned infrastructure
level: high
