title: Rclone Data Exfiltration Tool Execution
status: test
description: >
    Detects execution of rclone, a command-line tool frequently abused by
    ransomware and intrusion actors to bulk-copy data to cloud storage remotes
    (MEGA, Dropbox, S3, etc.). Matches on binary name / original filename and on
    renamed binaries via rclone-specific flag combinations.
references:
    - https://attack.mitre.org/techniques/T1567/002/
    - https://rclone.org/docs/
author: Detection Engineering
date: 2026/07/20
tags:
    - attack.exfiltration
    - attack.t1567.002
logsource:
    category: process_creation
    product: windows
detection:
    selection_binary:
        - Image|endswith: '\rclone.exe'
        - OriginalFileName: 'rclone.exe'
        - Description: 'Rsync for cloud storage'
    selection_action:
        CommandLine|contains:
            - ' copy'
            - ' sync'
            - ' move'
            - ' copyto'
    selection_flags:
        CommandLine|contains:
            - ' --config '
            - ' --transfers '
            - ' --multi-thread-streams'
            - ' --no-check-certificate'
            - ' --ignore-existing'
            - ' --auto-confirm'
            - ' --max-age'
    condition: selection_binary or (selection_action and selection_flags)
falsepositives:
    - Legitimate administrative or backup use of rclone (baseline known hosts/users and allowlist)
level: high
name: rclone_execution
