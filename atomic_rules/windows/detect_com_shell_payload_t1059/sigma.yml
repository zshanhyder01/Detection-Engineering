title: COM Server Spawning Shell
id: detect_com_shell_payload_t1059
name: test
status: experimental
description: Detects a COM server application spawning a command shell (Execution phase).
author: Zeeshan Haider
tags:
    - attack.execution                 # Tactic: Execution
    - attack.t1204.002                 # Technique: User Execution: Malicious File
    - attack.t1059                     # Technique: Command and Scripting Interpreter
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        ParentImage|endswith:
            - '\mmc.exe'
            - '\excel.exe'
            - '\powerpnt.exe'
            - '\outlook.exe'
        Image|endswith:
            - '\cmd.exe'
            - '\powershell.exe'
            - '\pwsh.exe'
            - '\rundll32.exe'
            - '\mshta.exe'
    condition: selection
