title: TwoFlags Implant Host Artifacts
id: TwoFlags_Implant_Host_Artifacts
status: test
# Event IDs: Sysmon EID 1 (process creation) | Security EID 4688
#            Also visible via Sysmon EID 11 (file create) when the implant is written to disk
logsource:
    category: process_creation
    product: windows
detection:
    selection_name:
        Image|endswith: '\cms_plugin.exe'
    condition: selection_name
level: high
tags:
    - attack.execution
    - attack.t1204.002
